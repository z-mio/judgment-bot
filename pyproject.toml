[project]
name = "judgment-bot"
version = "0.1.0"
description = "Telegram 入群验证 Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kurigram[fast]>=2.2.27",
    "loguru>=0.7.3",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "redis>=6.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.mypy]
python_version = "3.12"
files = ["./"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
